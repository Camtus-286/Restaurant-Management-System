<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borcelle Restaurant</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f0e8; }
        .card { display: flex; width: 860px; min-height: 500px; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 48px rgba(0,0,0,0.12); }
        .left { width: 55%; position: relative; }
        .left img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .overlay { position: absolute; inset: 0; background: rgba(26,37,53,0.45); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hex { width: 52px; height: 52px; background: #c9956a; clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
        .hex-icon { color: #fff; font-size: 18px; font-weight: bold; }
        .brand { font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 600; color: #fff; letter-spacing: 8px; text-transform: uppercase; text-align: center; }
        .brand-sub { font-size: 11px; letter-spacing: 5px; color: rgba(255,255,255,0.7); text-transform: uppercase; margin-top: 8px; }
        .right { width: 45%; background: #2c4a3e; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 52px 44px; }
        .welcome { font-family: 'Playfair Display', serif; font-size: 26px; color: #fff; margin-bottom: 8px; }
        .welcome-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 44px; letter-spacing: 1px; text-align: center; }
        .btn { display: block; width: 100%; max-width: 260px; padding: 15px 28px; border-radius: 6px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; text-align: center; transition: all 0.25s; font-family: 'Inter', sans-serif; }
        .btn-staff { background: #c9956a; color: #fff; margin-bottom: 16px; }
        .btn-staff:hover { background: #b8845a; color: #fff; transform: translateY(-2px); }
        .btn-customer { background: transparent; color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.25); }
        .btn-customer:hover { background: rgba(255,255,255,0.08); color: #fff; transform: translateY(-2px); }
        .divider { display: flex; align-items: center; gap: 12px; width: 260px; margin-bottom: 16px; }
        .div-line { flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
        .div-text { font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }
    </style>
</head>
<body>
<div class="card">
    <div class="left">
        <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=900&q=80" alt="Borcelle Restaurant">
        <div class="overlay">
            <div class="hex"><span class="hex-icon">✕</span></div>
            <div class="brand">Borcelle</div>
            <div class="brand-sub">Restaurant</div>
        </div>
    </div>
    <div class="right">
        <div class="welcome">Welcome!</div>
        <div class="welcome-sub">Please select your role to continue</div>
        <a href="/staff-login" class="btn btn-staff">Staff Login</a>
        <div class="divider">
            <div class="div-line"></div>
            <div class="div-text">or</div>
            <div class="div-line"></div>
        </div>
        <a href="/customer" class="btn btn-customer">Customer</a>
    </div>
</div>
</body>
</html>
